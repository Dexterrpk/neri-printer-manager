name: Package

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/package.yml"
      - "packaging/**"
      - "scripts/build_deb.sh"
      - "src/**"
      - "pyproject.toml"
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  deb:
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev
          python -m pip install --upgrade pip
      - name: Build and inspect Debian package
        run: |
          bash scripts/build_deb.sh
          dpkg-deb --info build/*.deb
          dpkg-deb --contents build/*.deb
      - name: Install and smoke-test package
        run: |
          sudo apt-get install -y --no-install-recommends ./build/*.deb
          dpkg-query -W -f='${Status} ${Version}\n' neri-printer-manager
          neri-printer-cli --version
          QT_QPA_PLATFORM=offscreen \
            PYTHONPATH=/opt/neri-printer-manager/lib \
            /usr/bin/python3 -c \
            'from PySide6.QtWidgets import QApplication; from neri_printer_manager.app import MainWindow; app = QApplication([]); window = MainWindow(auto_refresh=False); assert window.pages.count() == 7; window.close()'
          sudo apt-get remove -y neri-printer-manager
          test ! -e /usr/bin/neri-printer-manager
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: neri-printer-manager-deb-${{ matrix.os }}
          path: build/*.deb
          if-no-files-found: error
          retention-days: 14
