name: Package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev
          python -m pip install --upgrade pip
      - name: Build and inspect Debian package
        run: |
          bash scripts/build_deb.sh
          dpkg-deb --info build/*.deb
          dpkg-deb --contents build/*.deb
      - name: Install and smoke-test package
        run: |
          sudo apt-get install -y --no-install-recommends ./build/*.deb
          neri-printer-cli --version
          QT_QPA_PLATFORM=offscreen /opt/neri-printer-manager/venv/bin/python -c \
            'from neri_printer_manager.app import MainWindow'
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: neri-printer-manager-deb
          path: build/*.deb
          if-no-files-found: error
          retention-days: 14
