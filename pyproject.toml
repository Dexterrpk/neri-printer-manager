[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "neri-printer-manager"
version = "2.0.1"
description = "Diagnóstico e correção segura de impressoras no Linux Mint, criado por Cleiton Neri - Neri Infotech"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Cleiton Neri - Neri Infotech"}]
keywords = ["cups", "linux-mint", "printer", "pyside6", "samba", "hplip", "diagnostics"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: X11 Applications :: Qt",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = ["PySide6-Essentials>=6.6,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
dev = ["pytest>=8,<10", "ruff>=0.5", "mypy>=1.10"]

[project.urls]
Homepage = "https://github.com/Dexterrpk/neri-printer-manager"
Issues = "https://github.com/Dexterrpk/neri-printer-manager/issues"
Source = "https://github.com/Dexterrpk/neri-printer-manager"

[project.scripts]
neri-printer-manager = "neri_printer_manager.app:main"
neri-printer-cli = "neri_printer_manager.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/neri_printer_manager"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["neri_printer_manager"]
